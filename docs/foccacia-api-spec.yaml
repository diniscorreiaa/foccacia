openapi: 3.0.1

info:
  title: FOCCACIA API
  description: |
    FOCCACIA (Football Complete Clubs API and Chelas Internet Application).
  contact:
    name: Grupo 01 | IPW | LEIC31D | ISEL
    url: https://github.com/isel-leic-ipw/isel-leic-ipw-pi-2526i-foccacia-leic2526i-ipw31d-g01/issues
  license:
    name: ISC
    url: https://opensource.org/licenses/ISC
  version: 1.0.0

servers:
  - description: Servidor local para testes da API
    url: http://localhost:1904/api

tags:
  - name: Competitions
    description: Acesso a competições de futebol.
  - name: Teams
    description: Equipas e jogadores por competição e época.
  - name: Users
    description: Criação de utilizadores e emissão de tokens.
  - name: Groups
    description: Gestão dos grupos por utilizador autenticado.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: UUID
      description: Token UUID gerado na criação do utilizador.
    cookieAuth:
      type: apiKey
      in: cookie
      name: connect.sid

  parameters:
    competitionCodePath:
      name: competitionCode
      in: path
      required: true
      schema:
        type: string
      description: Código da competição
      example: PPL

    seasonYearPath:
      name: seasonYear
      in: path
      required: true
      schema:
        type: integer
        minimum: 2000
      description: Ano da época desportiva.
      example: 2025

    groupIdPath:
      name: groupId
      in: path
      required: true
      schema:
        type: string
      description: Identificador interno do grupo.
      example: "nhMekJsBNkrmp8pbael9" 

    playerIdPath:
      name: playerId
      in: path
      required: true
      schema:
        type: string
      description: Identificador do jogador (id do Football Data API).
      example: "67299"

  schemas:
    Competition:
      type: object
      properties:
        code:
          type: string
          example: PPL
        name:
          type: string
          example: Primeira Liga

    Player:
      type: object
      description: Jogador associado a uma equipa (competitions/teams) ou a um grupo.
      properties:
        id:
          type: string
          description: Identificador do jogador (Football Data).
          example: "67299"
        playerName:
          type: string
          example: Vangelis Pavlidis
        teamId:
          type: string
          description: Identificador da equipa (Football Data).
          example: "1903"
        teamCode:
          type: string
          description: Código curto (tla) da equipa.
          example: BEN
        teamName:
          type: string
          example: SL Benfica
        position:
          type: string
          example: Offence
        nationality:
          type: string
          example: Greece
        age:
          type: integer
          example: 27

    PlayerBasic:
      type: object
      description: Jogador associado a uma equipa (versão resumida para listagens de equipas).
      properties:
        playerName:
          type: string
          example: Vangelis Pavlidis
        position:
          type: string
          example: Offence

    Team:
      type: object
      description: Equipa com o respetivo plantel para uma competição/época.
      properties:
        teamName:
          type: string
          example: Sport Lisboa e Benfica
        country:
          type: string
          nullable: true
          example: Portugal
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerBasic"

    Group:
      type: object
      description: Grupo pertencente a um utilizador.
      properties:
        id:
          type: string
          example: nhMekJsBNkrmp8pbael9
        name:
          type: string
          example: Melhores da Champions
        description:
          type: string
          example: Onze ideal da Champions 2025
        competition:
          type: string
          description: Código da competição associada ao grupo.
          example: CL
        year:
          type: integer
          example: 2025
        players:
          type: array
          description: Lista de jogadores atualmente no grupo (máx. 11).
          items:
            $ref: "#/components/schemas/Player" 

    User:
      type: object
      description: Utilizador registado na FOCCACIA API.
      properties:
        id:
          type: string
          example: aJasEoPasQ
        username:
          type: string
          example: grupo1
        token:
          type: string
          format: uuid
          description: Token de autenticação a enviar no cabeçalho Authorization.
          example: 8fe814ec-434a-49d5-95c0-a66e1edf1c69

######## REQUESTS ################

    CreateUserRequest:
      type: object
      required:
        - username
      properties:
        username:
          type: string
          minLength: 3
          example: grupo1

    AddPlayerToGroupRequest:
      type: object
      required:
        - playerId
        - playerName
        - teamCode
        - teamName
      properties:
        playerId:
          type: string
          description: Identificador do jogador (Football Data).
          example: 67299
        playerName:
          type: string
          description: Nome do jogador.
          example: Vangelis Pavlidis
        teamCode:
          type: string
          description: Código curto (tla) da equipa.
          example: BEN
        teamName:
          type: string
          description: Nome curto da equipa.
          example: SL Benfica

    UpdateGroupRequest:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          minLength: 3
          example: Melhores da Champions (Atualizado)
        description:
          type: string
          minLength: 3
          example: Onze ideal da Champions 2025 (atualizado)

    CreateGroupRequest:
      type: object
      required:
        - name
        - description
        - competition
        - year
      properties:
        name:
          type: string
          minLength: 3
          example: Melhores da Champions
        description:
          type: string
          minLength: 3
          example: Onze ideal da Champions 2025
        competition:
          type: string
          example: CL
        year:
          type: integer
          minimum: 2023
          example: 2025

    Error:
      type: object
      description: Estrutura de erro comum a toda a API.
      properties:
        uri:
          type: string
          description: Caminho do recurso em que ocorreu o erro.
          example: /groups/1/players
        description:
          type: string
          description: Descrição legível do erro.
          example: Make sure you provide playerId, playerName, teamCode and teamName

  responses:
    ErrorBadRequest:
      description: Pedido inválido (dados em falta ou mal formatados).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ErrorUnauthorized:
      description: Token de autenticação ausente ou inválida.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ErrorForbidden:
      description: Acesso a recurso pertencente a outro utilizador.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ErrorNotFound:
      description: Recurso não encontrado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ErrorUnprocessableEntity:
      description: Violação de regras de negócio (por exemplo, jogador já existe no grupo, grupo cheio ou jogador/equipa não pertencem à competição/ano do grupo).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ErrorTooManyRequestsExternal:
      description: Limite de pedidos ao serviço externo de futebol atingido (rate limit).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ErrorBadGatewayExternal:
      description: Erro ao comunicar com o serviço externo de futebol.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ErrorInternal:
      description: Erro interno do servidor.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

paths:
  /competitions:
    get:
      tags:
        - Competitions
      summary: Lista todas as competições disponíveis.
      description: >
        Retorna o código e o nome de cada competição suportada pela FOCCACIA API,
        obtidas a partir do serviço externo de futebol.
      responses:
        "200":
          description: Lista de competições obtida com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Competition"
        "429":
          description: Limite de pedidos ao serviço externo de futebol atingido (rate limit).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                uri: "/competitions"
                description: "Rate limit exceeded for external API, try again in 1 minute"
        "502":
          description: Erro ao comunicar com o serviço externo de futebol.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                uri: "/competitions"
                description: "Error communicating with external football service"
        "500":
          description: Erro interno do servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                uri: "/competitions"
                description: "Unhandled error for get competitions operation"

  /competitions/{competitionCode}/seasons/{seasonYear}/teams:
    get:
      tags:
        - Teams
      summary: Lista as equipas e jogadores de uma competição e época.
      description: >
        Retorna a lista de equipas de uma determinada competição e época,
        incluindo o respetivo plantel (jogadores).
      parameters:
        - $ref: "#/components/parameters/competitionCodePath"
        - $ref: "#/components/parameters/seasonYearPath"
      responses:
        "200":
          description: Equipas da competição obtidas com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
              example:
                - teamName: "Sport Lisboa e Benfica"
                  country: "Portugal"
                  players:
                    - playerName: "Vangelis Pavlidis"
                      position: "Offence"
                    - playerName: "Anatolii Trubin"
                      position: "Goalkeeper"
                    - playerName: "Amar Dedić"
                      position: "Right-Back"
                - teamName: "Sporting Clube de Portugal"
                  country: "Portugal"
                  players:
                    - playerName: "Viktor Gyökeres"
                      position: "Centre-Forward"
                    - playerName: "Franco Israel"
                      position: "Goalkeeper"
        "404":
          description: Competição ou época não encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                uri: "/competitions/PPL/seasons/2025/teams"
                description: "Competition or season not found"
        "429":
          description: Limite de pedidos ao serviço externo de futebol atingido (rate limit).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                uri: "/competitions/PPL/seasons/2025/teams"
                description: "Rate limit exceeded for external API, try again in 1 minute"
        "502":
          description: Erro ao comunicar com o serviço externo de futebol.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                uri: "/competitions/PPL/seasons/2025/teams"
                description: "Error communicating with external football service"
        "500":
          description: Erro interno do servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                uri: "/competitions/PPL/seasons/2025/teams"
                description: "Unhandled error for get teams operation"
  /users:
    post:
      tags:
        - Users
      summary: Cria um novo utilizador.
      description: >
        Cria um utilizador na FOCCACIA API e gera um token UUID que deve ser
        usado no cabeçalho `Authorization: Bearer <token>` nas operações sobre grupos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Utilizador criado com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  username:
                    type: string
                    example: grupo1
                  token:
                    type: string
                    format: uuid
                    description: Token de autenticação a enviar no cabeçalho Authorization.
                    example: 8fe814ec-434a-49d5-95c0-a66e1edf1c69

        "400":
          description: Pedido inválido (dados em falta ou mal formatados).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                uri: "/users"
                description: "Username must contain at least 3 characters"
        "500":
          description: Erro interno do servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                uri: "/users"
                description: "Unexpected error at user creation"

  /groups:
    get:
      tags:
        - Groups
      summary: Lista todos os grupos do utilizador autenticado.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Lista de grupos obtida com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
              example:
              - id: "NDJLpZsB41uE1fzWaJ7S"
                name: "Melhores da Liga 2025"
                description: "Onze ideal da Primeira Liga"
                competition: "PPL"
                year: 2025
                players:
                  - id: "67299"
                    playerName: "Vangelis Pavlidis"
                    teamId: "1903"
                    teamName: "SL Benfica"
                    position: "Offence"
                    nationality: "Greece"
                    age: 27
                  - id: "111481"
                    playerName: "Anatolii Trubin"
                    teamId: "1903"
                    teamName: "SL Benfica"
                    position: "Goalkeeper"
                    nationality: "Ukraine"
                    age: 24
                  - id: "81816"
                    playerName: "Amar Dedić"
                    teamId: "1903"
                    teamName: "SL Benfica"
                    position: "Right-Back"
                    nationality: "Bosnia-Herzegovina"
                    age: 23
              - id: "NTJMpZsB41uE1fzWK54W"
                name: "Grupo vazio"
                description: "Vazio"
                competition: "PPL"
                year: 2025
                players: [] 
              - id: "NZ1uE1fzW1uEMpZsB44W"
                name: "Melhores dos melhores"
                description: "Onze ideal 2025"
                competition: "PPL"
                year: 2025
                players:
                  - id: "185610"
                    playerName: "Antonio Silva"
                    teamId: "1903"
                    teamName: "SL Benfica"
                    position: "Centre-Back"
                    nationality: "Portugal"
                    age: 22
                  - id: "3205"
                    playerName: "Nicolás Otamendi"
                    teamId: "1903"
                    teamName: "SL Benfica"
                    position: "Centre-Back"
                    nationality: "Argentina"
                    age: 37
        "401":
          description: Token de autenticação ausente ou inválida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                uri: "/groups"
                description: "You must provide user Id for getting groups"
        "500":
          description: Erro interno do servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                uri: "/groups"
                description: "Unexpected error at getting groups"

    post:
      tags:
        - Groups
      summary: Cria um novo grupo “Best XI”.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "201":
          description: Grupo criado com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
              example:
                id: "NDJLpZsB41uE1fzWaJ7S"
                name: "Melhores da Liga 2025"
                description: "Onze ideal da Primeira Liga"
                competition: "PPL"
                year: 2025
                players: []

        "400":
          description: Pedido inválido (dados em falta ou mal formatados).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidName:
                  summary: Nome do grupo inválido
                  value:
                    uri: "/groups"
                    description: "Invalid group name"
                invalidDescription:
                  summary: Descrição do grupo inválida
                  value:
                    uri: "/groups"
                    description: "Invalid group description"
                invalidCompetition:
                  summary: Código de competição inválido
                  value:
                    uri: "/groups"
                    description: "Invalid competition"
                invalidYear:
                  summary: Ano inválido
                  value:
                    uri: "/groups"
                    description: "Invalid year"
        "401":
          description: Token de autenticação ausente ou inválida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                uri: "/groups"
                description: "You must authenticate yourself for group creation"
        "500":
          description: Erro interno do servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                uri: "/groups"
                description: "Unexpected error at group creation"

  /groups/{groupId}:
    parameters:
      - $ref: "#/components/parameters/groupIdPath"
    get:
      tags:
        - Groups
      summary: Obtém os detalhes de um grupo do utilizador autenticado.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Detalhes do grupo obtidos com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "401":
          description: Token de autenticação ausente ou inválida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                uri: "/groups"
                description: "You must authenticate yourself before getting group details"
        "403":
          description: Acesso a recurso pertencente a outro utilizador.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                uri: "/groups/nhMekJsBNkrmp8pbael9"
                description: "You do not have access to this group"
        "404":
          description: Recurso não encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                uri: "/groups/nhMekJsBNkrmp8pbael9"
                description: "Group not found"
        "500":
          description: Erro interno do servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                uri: "/groups/nhMekJsBNkrmp8pbael9"
                description: "Unexpected error at getting group details"

    put:
      tags:
        - Groups
      summary: Edita o nome e a descrição de um grupo.
      description: >
        Atualiza apenas o nome e a descrição do grupo. A competição e o ano
        permanecem inalterados.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGroupRequest"
      responses:
        "200":
          description: Grupo atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          description: Pedido inválido (dados em falta ou mal formatados).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidName:
                  summary: Nome do grupo inválido
                  value:
                    uri: "/groups/nhMekJsBNkrmp8pbael9"
                    description: "Invalid group name"
                invalidDescription:
                  summary: Descrição do grupo inválida
                  value:
                    uri: "/groups/nhMekJsBNkrmp8pbael9"
                    description: "Invalid group description"
                missingChanges:
                  summary: Dados de alteração em falta
                  value:
                    uri: "/groups/nhMekJsBNkrmp8pbael9"
                    description: "Make sure you provide changes for this operation"
        "401":
          description: Token de autenticação ausente ou inválida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                uri: "/groups/nhMekJsBNkrmp8pbael9"
                description: "You must authenticate yourself before updating groups"
        "403":
          description: Acesso a recurso pertencente a outro utilizador.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                uri: "/groups/nhMekJsBNkrmp8pbael9"
                description: "You do not have access to this group"
        "404":
          description: Recurso não encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                uri: "/groups/nhMekJsBNkrmp8pbael9"
                description: "Group not found"
        "500":
          description: Erro interno do servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                uri: "/groups/nhMekJsBNkrmp8pbael9"
                description: "Unexpected error at group update"
              
    delete:
      tags:
        - Groups
      summary: Remove um grupo.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Grupo removido com sucesso **(sem conteúdo de resposta)**.
        "401":
          description: Token de autenticação ausente ou inválida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                uri: "/groups/nhMekJsBNkrmp8pbael9"
                description: "You must authenticate yourself before deleting a group"
        "403":
          description: Acesso a recurso pertencente a outro utilizador.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                uri: "/groups/nhMekJsBNkrmp8pbael9"
                description: "You do not have access to this group"
        "404":
          description: Recurso não encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                uri: "/groups/nhMekJsBNkrmp8pbael9"
                description: "Group not found"
        "500":
          description: Erro interno do servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                uri: "/groups/nhMekJsBNkrmp8pbael9"
                description: "Unexpected error at deleting group"

  /groups/{groupId}/players:
    parameters:
      - $ref: "#/components/parameters/groupIdPath"
    post:
      tags:
        - Groups
      summary: Adiciona um jogador a um grupo “Best XI”.
      description: >
        Adiciona um jogador ao grupo, garantindo que:
        - o jogador pertence à equipa (`teamCode`, `teamName`) indicada;
        - a equipa/jogador pertencem à mesma competição/ano do grupo;
        - o jogador ainda não existe no grupo;
        - o grupo não excede 11 jogadores.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPlayerToGroupRequest"
      responses:
        "200":
          description: Jogador adicionado com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          description: Pedido inválido (dados em falta ou mal formatados).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingData:
                  summary: Dados do jogador em falta
                  value:
                    uri: "/groups/nhMekJsBNkrmp8pbael9/players"
                    description: "Make sure you provide player data for this operation"
                invalidPlayerId:
                  summary: ID do jogador inválido
                  value:
                    uri: "/groups/nhMekJsBNkrmp8pbael9/players"
                    description: "Invalid playerId"
                invalidPlayerName:
                  summary: Nome do jogador inválido
                  value:
                    uri: "/groups/nhMekJsBNkrmp8pbael9/players"
                    description: "Invalid playerName"
                invalidTeamCode:
                  summary: Código da equipa inválido
                  value:
                    uri: "/groups/nhMekJsBNkrmp8pbael9/players"
